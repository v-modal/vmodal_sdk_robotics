name: sdk_robot_test_simul_release

# Standalone public SDK compatibility tests; no credentials are required.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lerobot/**"
      - ".github/workflows/sdk_robot_test_simul_release.yml"
  push:
    branches: [main]
    paths:
      - "lerobot/**"
      - ".github/workflows/sdk_robot_test_simul_release.yml"

permissions:
  contents: read

concurrency:
  group: sdk_robot_ros2_${{ github.ref }}
  cancel-in-progress: true

env:
  WORKDIR: lerobot

jobs:
  secret_detection:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Reject verified secrets
        run: docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.90.5 filesystem /repo --exclude-paths=/repo/.trufflehog-exclude --only-verified --fail

  ros2_compatibility:
    needs: secret_detection
    name: ROS 2 ${{ matrix.ros }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros: humble
            os: ubuntu-22.04
            image: ros:humble-ros-base-jammy
            python: "3.10"
          - ros: jazzy
            os: ubuntu-24.04
            image: ros:jazzy-ros-base-noble
            python: "3.12"
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native ROS test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git rsync python3-pip python3-dev \
            "ros-${ROS_DISTRO}-demo-nodes-py" "ros-${ROS_DISTRO}-ros2bag" \
            "ros-${ROS_DISTRO}-rosbag2-storage-default-plugins"
          # rclpy must use Ubuntu's Python ABI; do not use setup-python here.
          python3 --version | grep -F "Python ${{ matrix.python }}."

      - name: Checkout exact candidate commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: README install verbatim before build-tool bootstrap
        working-directory: ${{ env.WORKDIR }}
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          python3 -m pip --version
          if [[ "$ROS_DISTRO" == humble ]]; then
            python3 -m pip --version | grep -F 'pip 22.0.2'
          fi
          python3 -m pip install .
          python3 -m pip show vmodal-robotics
          cd /tmp
          env -u PYTHONPATH vmodal-robot --help

      - name: Run SDK suite alongside ROS 2 nodes
        working-directory: ${{ env.WORKDIR }}
        env:
          # Pip installs are confined to this disposable container. Required by
          # Ubuntu 24.04's externally managed system Python; no virtualenvs.
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: bash ros2_test.sh test "$RUNNER_TEMP/ros2-test"

      - name: Upload ROS and SDK diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-robot-ros2-${{ matrix.ros }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/ros2-test/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested wheel and source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-robot-ros2-package-${{ matrix.ros }}-${{ github.run_id }}-${{ github.sha }}
          path: ${{ env.WORKDIR }}/dist/*
          if-no-files-found: error
          retention-days: 14

  minio_example:
    needs: secret_detection
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Start disposable MinIO
        run: |
          docker build -f lerobot/tests/minio.Dockerfile -t vmodal-minio-test lerobot/tests
          docker run -d --name minio -p 9000:9000 vmodal-minio-test
      - name: Install and test worked transport
        working-directory: lerobot
        run: |
          python3 -m pip install '.[s3,rosbag]'
          export PYTHONPATH="$PWD:$PWD/src"
          python3 tests/test_s3.py test_all
          python3 tests/test_s3.py test_live --endpoint=http://127.0.0.1:9000
