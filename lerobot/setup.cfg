[metadata]
name = vmodal-robotics
version = attr: vmodal_robot.__version__
description = Durable robot uploader and offline multimodal reconciliation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = v-modal
url = https://github.com/v-modal/vmodal_sdk_robotics
project_urls =
    Repository = https://github.com/v-modal/vmodal_sdk_robotics
    Documentation = https://v-modal.github.io/vmodal_sdk_robotics/
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Operating System :: POSIX :: Linux

[options]
python_requires = >=3.10
install_requires = fire>=0.6.0,<1
package_dir =
    = src
packages = find:

[options.packages.find]
where = src
include = vmodal_robot, vmodal_robot.*

[options.extras_require]
vmodal = vmodal>=1.0.0,<2
s3 = aiobotocore>=2.21,<3
rosbag = PyYAML>=6,<7
dev =
    build>=1.2.1,<2
    twine>=5.1.0,<7
    setuptools>=68,<77
    wheel>=0.45,<1
    packaging>=24.2,<27
docs = pdoc==15.0.4

[options.entry_points]
console_scripts =
    vmodal-robot = vmodal_robot.cli:main
    vmodal-ros2-manifest = vmodal_robot.ros2_manifest:main
    vmodal-robot-metrics = vmodal_robot.monitoring:main
