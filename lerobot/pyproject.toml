[build-system]
requires = ["setuptools>=68,<77", "wheel>=0.45,<1", "packaging>=24.2,<27"]
build-backend = "setuptools.build_meta"

# setup.cfg is authoritative metadata, including static name and dynamic version.
# Ubuntu 22.04 pip 22.0.2 can load distro setuptools during isolated builds;
# that backend understands setup.cfg but silently ignores PEP 621 metadata.
